<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-inner">
                <div class="front">
                    <h2>Toni Kroos</h2>
                    <p>Football Player, Germany</p>
                    <button>hover me</button>
                </div>
                <div class="back">
                    <h1>Toni <span>Kroos</span></h1>
                    <p>Toni Kroos is a German former football player. He was born on January 4, 1990. He played for Real Madrid and won the 2014 FIFA World Cup with Germany.</p>
                    <div class="row">
                        <div class="col">
                            <h2>48M</h2>
                            <p>Followers</p>
                        </div>
                            <div class="col">
                            <h2>418</h2>
                            <p>Following</p>
                        </div>
                    </div>
                    <div class="row">
                        <i class="ri-instagram-line"></i>
                        <i class="ri-tiktok-line"></i>
                        <button>Follow</button>
                    </div>
                </div>
            </div>
        </div>


    </div>

</body>
</html>
